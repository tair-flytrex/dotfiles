bind-key g display-popup -E -w 90% -h 90% lazygit

set -g focus-events on

# Popups use the terminal colours instead of the grey theme default
set -g popup-style default
set -g popup-border-style default

set -g set-titles on
set -g set-titles-string "#S"

set -g base-index 1
set -g pane-base-index 1
